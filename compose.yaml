name: tongpin
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      ALLOWED_ORIGIN: https://${DOMAIN:?Please set DOMAIN in .env}
    volumes:
      - game-data:/app/data
    expose:
      - "3001"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Please set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  game-data:
  caddy-data:
  caddy-config:
